services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: supernova
      POSTGRES_USER: supernova
      POSTGRES_PASSWORD: supernova
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supernova"]
      interval: 5s
      timeout: 5s
      retries: 5

  supernova:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # LLM provider — set one of these
      SUPERNOVA_ANTHROPIC_API_KEY: ${SUPERNOVA_ANTHROPIC_API_KEY:-}
      SUPERNOVA_OPENAI_API_KEY: ${SUPERNOVA_OPENAI_API_KEY:-}

      # Channel tokens — set the ones you use
      SUPERNOVA_TELEGRAM_TOKEN: ${SUPERNOVA_TELEGRAM_TOKEN:-}
      SUPERNOVA_DISCORD_TOKEN: ${SUPERNOVA_DISCORD_TOKEN:-}
      SUPERNOVA_DISCORD_APP_ID: ${SUPERNOVA_DISCORD_APP_ID:-}

      # Database (matches the postgres service above)
      SUPERNOVA_DB_HOST: postgres
      SUPERNOVA_DB_PORT: "5432"
      SUPERNOVA_DB_NAME: supernova
      SUPERNOVA_DB_USER: supernova
      SUPERNOVA_DB_PASSWORD: supernova
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
