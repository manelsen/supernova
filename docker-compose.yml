services:
  supernova:
    container_name: supernova
    build: .
    environment:
      # LLM provider — set one of these
      SUPERNOVA_PROVIDER_MISTRAL_API_KEY: ${SUPERNOVA_PROVIDER_MISTRAL_API_KEY:-}
      SUPERNOVA_PROVIDER_ANTHROPIC_API_KEY: ${SUPERNOVA_PROVIDER_ANTHROPIC_API_KEY:-}
      SUPERNOVA_PROVIDER_OPENAI_API_KEY: ${SUPERNOVA_PROVIDER_OPENAI_API_KEY:-}

      # Channel tokens — set the ones you use
      SUPERNOVA_TELEGRAM_TOKEN: ${SUPERNOVA_TELEGRAM_TOKEN:-}
      SUPERNOVA_DISCORD_TOKEN: ${SUPERNOVA_DISCORD_TOKEN:-}
      SUPERNOVA_DISCORD_APP_ID: ${SUPERNOVA_DISCORD_APP_ID:-}

      # Closed-group allowlist bootstrap
      SUPERNOVA_ACCESS_ADMINS: ${SUPERNOVA_ACCESS_ADMINS:-}
      SUPERNOVA_ACCESS_MEMBERS: ${SUPERNOVA_ACCESS_MEMBERS:-}

      # Runtime state: access.json, ledger/ and audit_log/
      SUPERNOVA_DATA_DIR: /data

      # The agent's computer (optional; see docs/operations/COMPUTADOR.md)
      SUPERNOVA_COMPUTER_URL: ${SUPERNOVA_COMPUTER_URL:-}
      SUPERNOVA_COMPUTER_TOKEN: ${SUPERNOVA_COMPUTER_TOKEN:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 30s
    restart: unless-stopped
    volumes:
      - ./supernova.yaml:/config/supernova.yaml:ro
      - supernova_data:/data
    networks:
      # Supernova's own traffic (model APIs, channels) must leave through
      # its own network, not the computer's: the host firewall rules for
      # br-computador would otherwise apply to Supernova too.
      default:
        gw_priority: 1
      computador_net: {}

  # The agent's computer: a Linux machine with a shell and a browser, apart
  # from Supernova and holding none of its secrets. Off unless the
  # "computador" profile is on (COMPOSE_PROFILES=computador in .env). Runs on
  # gVisor (runsc) by default: see docs/operations/COMPUTADOR.md.
  computador:
    profiles: ["computador"]
    container_name: supernova-computador
    build: ./computador
    runtime: ${SUPERNOVA_COMPUTER_RUNTIME:-runsc}
    environment:
      COMPUTADOR_TOKEN: ${SUPERNOVA_COMPUTER_TOKEN:-}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    shm_size: 1g
    restart: unless-stopped
    volumes:
      - computador_home:/home/pwuser
      # Docker's DNS does not answer inside gVisor on this network.
      - ./computador/resolv.conf:/etc/resolv.conf:ro
    networks: [computador_net]

  # Observability: Prometheus keeps the history of Supernova's /metrics and
  # Grafana shows it as a dashboard. Off unless the "observabilidade" profile
  # is on (COMPOSE_PROFILES=observabilidade in .env). Both listen only on the
  # host's loopback; reach them through an SSH tunnel. See
  # docs/operations/OBSERVABILITY.md.
  prometheus:
    profiles: ["observabilidade"]
    container_name: supernova-prometheus
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --storage.tsdb.retention.size=2GB
    mem_limit: 512m
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [default]

  grafana:
    profiles: ["observabilidade"]
    container_name: supernova-grafana
    image: grafana/grafana:12.1.1
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${SUPERNOVA_GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/supernova.json
    mem_limit: 512m
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks: [default]

networks:
  # The computer's own network. Its bridge has a fixed name so a host
  # firewall rule can keep the computer away from the host and the local
  # network (docs/operations/COMPUTADOR.md).
  computador_net:
    driver_opts:
      com.docker.network.bridge.name: br-computador

volumes:
  supernova_data:
  computador_home:
  prometheus_data:
  grafana_data:
