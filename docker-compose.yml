services:
  supernova:
    container_name: supernova
    build: .
    environment:
      # LLM provider — set one of these
      SUPERNOVA_PROVIDER_MISTRAL_API_KEY: ${SUPERNOVA_PROVIDER_MISTRAL_API_KEY:-}
      SUPERNOVA_PROVIDER_ANTHROPIC_API_KEY: ${SUPERNOVA_PROVIDER_ANTHROPIC_API_KEY:-}
      SUPERNOVA_PROVIDER_OPENAI_API_KEY: ${SUPERNOVA_PROVIDER_OPENAI_API_KEY:-}

      # Channel tokens — set the ones you use
      SUPERNOVA_TELEGRAM_TOKEN: ${SUPERNOVA_TELEGRAM_TOKEN:-}
      SUPERNOVA_DISCORD_TOKEN: ${SUPERNOVA_DISCORD_TOKEN:-}
      SUPERNOVA_DISCORD_APP_ID: ${SUPERNOVA_DISCORD_APP_ID:-}

      # Closed-group allowlist bootstrap
      SUPERNOVA_ACCESS_ADMINS: ${SUPERNOVA_ACCESS_ADMINS:-}
      SUPERNOVA_ACCESS_MEMBERS: ${SUPERNOVA_ACCESS_MEMBERS:-}

      # Runtime state: access.json, ledger/ and audit_log/
      SUPERNOVA_DATA_DIR: /data

      # WhatsApp through GOWA (optional; see docs/operations/WHATSAPP.md)
      SUPERNOVA_WHATSAPP_ENABLED: ${SUPERNOVA_WHATSAPP_ENABLED:-false}
      SUPERNOVA_WHATSAPP_BRIDGE_URL: http://gowa:3000
      SUPERNOVA_WHATSAPP_BASIC_AUTH: ${SUPERNOVA_WHATSAPP_BASIC_AUTH:-}
      SUPERNOVA_WHATSAPP_WEBHOOK_SECRET: ${SUPERNOVA_WHATSAPP_WEBHOOK_SECRET:-}
      SUPERNOVA_WHATSAPP_DEVICE_ID: ${SUPERNOVA_WHATSAPP_DEVICE_ID:-}

      # The agent's computer (optional; see docs/operations/COMPUTADOR.md).
      # Supernova reaches it through the dispatcher (PRD-K, K-03), with the
      # dispatcher's token; the computer's own token stays in the dispatcher.
      SUPERNOVA_COMPUTER_URL: ${SUPERNOVA_COMPUTER_URL:-}
      SUPERNOVA_COMPUTER_TOKEN: ${SUPERNOVA_COMPUTER_TOKEN:-}
      # The probes' web search (PRD-S, S17): SearXNG by default, Tavily as
      # the second option. The Tavily key stays here, never in the computer.
      SUPERNOVA_SEARCH_PROVIDER: ${SUPERNOVA_SEARCH_PROVIDER:-searxng}
      SUPERNOVA_SEARXNG_URL: ${SUPERNOVA_SEARXNG_URL:-http://searxng:8080}
      SUPERNOVA_TAVILY_API_KEY: ${SUPERNOVA_TAVILY_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Turns in progress get 40 s to finish (channel/registry.drain_timeout_ms);
    # what does not finish is answered after the restart.
    stop_grace_period: 60s
    restart: unless-stopped
    volumes:
      - ./supernova.yaml:/config/supernova.yaml:ro
      - supernova_data:/data
    # Not on the computers' network (PRD-K, section 3.3): a computer cannot
    # open a connection to Supernova. The dispatcher carries the calls. And
    # no Docker socket here, ever (K-I6).
    networks: [default]

  # The dispatcher (PRD-K, K20): the only container with the Docker socket.
  # It turns people's computers on and off and deletes them, with the
  # parameters fixed in its code, and carries Supernova's calls to them.
  despachante:
    profiles: ["computador"]
    container_name: supernova-despachante
    build: ./despachante
    environment:
      DESPACHANTE_TOKEN: ${SUPERNOVA_COMPUTER_TOKEN:-}
      COMPUTADOR_TOKEN: ${SUPERNOVA_COMPUTADOR_TOKEN_INTERNO:-}
      DESPACHANTE_IMAGEM: supernova-computador:latest
      DESPACHANTE_RUNTIME: ${SUPERNOVA_COMPUTER_RUNTIME:-runsc}
      DESPACHANTE_SAIDA: supernova-saida
      DESPACHANTE_SAIDA_ADMIN: http://saida:7072
      SAIDA_TOKEN: ${SUPERNOVA_SAIDA_TOKEN:-}
      SAIDA_CREDENCIAL: ${SUPERNOVA_SAIDA_CREDENCIAL:-}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    mem_limit: 128m
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Handed to every computer, read-only: Docker's DNS does not answer
      # inside gVisor on the computers' networks.
      - ./computador/resolv.conf:/etc/computador/resolv.conf:ro
    # Each person's computer has a network of its own, which the dispatcher
    # makes and joins (K-I4); it listens only here, on Supernova's network.
    networks: [default]

  # The computers' only way out (PRD-K, K-05). Each computer's network is
  # internal; the dispatcher puts this proxy on it. The browser passes with
  # the person's credential; the shell only to a list of sites. It refuses
  # internal addresses and resolves names itself. No Docker socket.
  saida:
    profiles: ["computador"]
    container_name: supernova-saida
    build: ./saida
    environment:
      SAIDA_TOKEN: ${SUPERNOVA_SAIDA_TOKEN:-}
      SAIDA_CREDENCIAL: ${SUPERNOVA_SAIDA_CREDENCIAL:-}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    mem_limit: 256m
    restart: unless-stopped
    networks:
      # Out to the internet through a network of its own.
      saida_net:
        gw_priority: 1
      # The dispatcher's door.
      default: {}

  # The image of people's computers: a Linux machine with a shell and a
  # browser, apart from Supernova and holding none of its secrets. Built
  # here, never run here: the dispatcher makes each person's computer from
  # it (PRD-K, K-04), on gVisor. Off unless the "computador" profile is on
  # (COMPOSE_PROFILES=computador in .env). See docs/operations/COMPUTADOR.md.
  computador:
    profiles: ["computador"]
    build: ./computador
    image: supernova-computador:latest
    deploy:
      replicas: 0

  # SearXNG (AGPL-3.0, unmodified): the probes' web search (PRD-S, S17,
  # S18). On the computer's network, so it reaches the internet but not the
  # host or the LAN (the firewall rules in COMPUTADOR.md); no port is
  # published, only Supernova talks to it. Pinned by digest
  # (2026.11.11-626105eec); update by hand.
  searxng:
    profiles: ["computador"]
    container_name: supernova-searxng
    image: searxng/searxng:2026.11.11-626105eec@sha256:606fc8852a53f0be4ac05116950ff480f6f56b8ef7d77b366868cc76478036e5
    environment:
      SEARXNG_SECRET: ${SUPERNOVA_SEARXNG_SECRET:-}
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    restart: unless-stopped
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    # Out to the internet through the computers' network (its firewall
    # rules); Supernova asks it on its own network.
    networks:
      computador_net:
        gw_priority: 1
      default: {}

  # WhatsApp: GOWA (go-whatsapp-web-multidevice, MIT), the bridge to the
  # WhatsApp account. Off unless the "whatsapp" profile is on
  # (COMPOSE_PROFILES=whatsapp in .env). Pinned by digest (v9.10.0); update
  # by hand after reading the changelog. Its web UI is only for pairing:
  # on the host's loopback, reached through an SSH tunnel. Its media
  # (/statics) is served without auth: never publish this port elsewhere.
  # See docs/operations/WHATSAPP.md.
  gowa:
    profiles: ["whatsapp"]
    container_name: supernova-gowa
    image: aldinokemal2104/go-whatsapp-web-multidevice:v9.10.0@sha256:026f31c4d2e3fb448a7cc1abbb3319a7ddc25d51ed9136f2ea7ae0b03219a53c
    environment:
      APP_PORT: "3000"
      APP_BASIC_AUTH: ${SUPERNOVA_WHATSAPP_BASIC_AUTH:-}
      APP_ALLOW_UNAUTHENTICATED: "false"
      # The UI that comes in the image; never fetched from GitHub (D4).
      APP_UI_AUTO_UPDATE: "false"
      MCP_ENABLED: "false"
      # Empty on purpose: GOWA's example answers every message by itself.
      WHATSAPP_AUTO_REPLY: ""
      WHATSAPP_AUTO_MARK_READ: "false"
      WHATSAPP_AUTO_DOWNLOAD_MEDIA: "true"
      WHATSAPP_WEBHOOK: http://supernova:8790/webhook/whatsapp
      WHATSAPP_WEBHOOK_SECRET: ${SUPERNOVA_WHATSAPP_WEBHOOK_SECRET:-}
      WHATSAPP_WEBHOOK_EVENTS: message,device.logged_out,device.temporary_ban
      WHATSAPP_WEBHOOK_INCLUDE_OUTGOING: "false"
    mem_limit: 512m
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - gowa_storages:/app/storages
      - gowa_statics:/app/statics
    networks: [default]

  # Observability: Prometheus keeps the history of Supernova's /metrics and
  # Grafana shows it as a dashboard. Off unless the "observabilidade" profile
  # is on (COMPOSE_PROFILES=observabilidade in .env). Both listen only on the
  # host's loopback; reach them through an SSH tunnel. See
  # docs/operations/OBSERVABILITY.md.
  prometheus:
    profiles: ["observabilidade"]
    container_name: supernova-prometheus
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --storage.tsdb.retention.size=2GB
    mem_limit: 512m
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [default]

  grafana:
    profiles: ["observabilidade"]
    container_name: supernova-grafana
    image: grafana/grafana:12.1.1
    depends_on: [prometheus]
    # Writes the alert provisioning from .env, then runs the image's /run.sh.
    entrypoint: ["/bin/sh", "/etc/supernova/alerting/grafana-start.sh"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${SUPERNOVA_GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/supernova.json
      # Alerts on Telegram, once a chat is set; until then they only show on
      # Grafana's Alerting page. By default they come from Supernova's own
      # bot; a separate bot keeps them out of the agent's chat
      # (docs/operations/OBSERVABILITY.md).
      SUPERNOVA_ALERT_TELEGRAM_CHAT: ${SUPERNOVA_ALERT_TELEGRAM_CHAT:-}
      SUPERNOVA_ALERT_TELEGRAM_TOKEN: ${SUPERNOVA_ALERT_TELEGRAM_TOKEN:-${SUPERNOVA_TELEGRAM_TOKEN:-}}
      SUPERNOVA_ALERT_DAILY_USD: ${SUPERNOVA_ALERT_DAILY_USD:-4}
    mem_limit: 512m
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/alerting:/etc/supernova/alerting:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks: [default]

networks:
  # SearXNG's way out. Its bridge has a fixed name so the host firewall
  # rules keep it away from the host and the LAN, like the computers'
  # (`brc-*`, one per person, made by the dispatcher).
  # The proxy's way out: nothing else on it.
  saida_net:
    name: supernova_saida
  computador_net:
    name: supernova_computador
    driver_opts:
      com.docker.network.bridge.name: br-computador

volumes:
  supernova_data:
  gowa_storages:
  gowa_statics:
  prometheus_data:
  grafana_data:
