name: Test Suite

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
          rebar3-version: "3.24.0"

      # Dependencies and compiled artefacts. Gleam rebuilds whatever changed, and
      # the coverage script derives source and test modules from src/ and test/,
      # so a stale beam of a deleted module is never run or counted.
      - name: Cache Gleam build
        uses: actions/cache@v4
        with:
          path: build
          key: gleam-build-${{ runner.os }}-${{ hashFiles('.tool-versions', 'manifest.toml') }}-${{ github.sha }}
          restore-keys: |
            gleam-build-${{ runner.os }}-${{ hashFiles('.tool-versions', 'manifest.toml') }}-

      - name: Download dependencies
        run: gleam deps download

      - name: Check formatting
        run: gleam format --check src test

      - name: Build with warnings as errors
        run: gleam build --warnings-as-errors

      # One instrumented run: it fails on any failing test and on coverage
      # below the threshold.
      - name: Run test suite with line coverage gate
        run: make coverage

      - name: Ensure working tree is clean of test artifacts
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Working tree has unexpected changes after tests:"
            git status --short
            exit 1
          fi
