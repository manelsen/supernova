name: despachante

# The dispatcher (despachante/, PRD-K, K-03, K-04): its tests against a
# fake Docker, then the network test with real Docker (runc; CI has no
# gVisor): two people's computers, made by the dispatcher, reach neither
# Supernova, nor the dispatcher, nor each other; forgetting leaves nothing.
on:
  push:
    branches: [master]
    paths: ["despachante/**", "scripts/teste-rede-despachante.sh", "scripts/teste-tunel.sh", "cloudflared/**", "computador/resolv.conf", "docker-compose.yml", ".github/workflows/despachante.yml"]
  pull_request:
    paths: ["despachante/**", "scripts/teste-rede-despachante.sh", "scripts/teste-tunel.sh", "cloudflared/**", "computador/resolv.conf", "docker-compose.yml", ".github/workflows/despachante.yml"]

permissions:
  contents: read

jobs:
  despachante:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t sn-despachante despachante/
      - name: Run tests
        run: docker run --rm --cap-drop ALL --security-opt no-new-privileges sn-despachante npm test --prefix /opt/despachante
      - name: Network test
        run: scripts/teste-rede-despachante.sh
      - name: Tunnel test (only /tela/* is published)
        run: scripts/teste-tunel.sh
